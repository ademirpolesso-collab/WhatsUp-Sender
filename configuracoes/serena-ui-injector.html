<!-- SERENA_CLINIC_CONFIG_START -->
<script id="serena-clinic-config-inline">
(function () {
  if (window.__serenaUiInjectorBootedV4) return;
  window.__serenaUiInjectorBootedV4 = true;

  var SERENA_DEFAULTS = /*__SERENA_DEFAULTS_START__*/{"assistantName":"Serena","clinicName":"OdontoCompany Bela Vista Osasco","clinicAddress":"Av Antonio Carlos Costa 991","parkingInfo":"Estacionamento no local","receptionName":"Recepção","receptionWhatsapp":"","crcEnabled":true,"zeldaGroupEnabled":true,"zeldaGroupTarget":"","zeldaCaretakerPhone":"","zeldaApprovalQuorum":3,"zeldaAllowFromMeTest":true,"maxActiveMessagesPerHour":30,"enableSpintax":true,"enableOptOutBlacklist":true,"serenaKeepUnreadForHuman":true}/*__SERENA_DEFAULTS_END__*/;
  var STORAGE_KEY = "serena_clinic_settings_v2";
  var ZELDA_TASKS_KEY = "zelda_condominio_activities_v1";
  var DASH_DATE_KEY = "serena_dashboard_date_filter_v1";

  var liveWaConn = { connected: false, stateLabel: "Desconectada (WhatsApp Offline)", phone: "" };
  var activeSettingsScreen = "geral"; // "geral" | "zelda"
  var lastClickedSection = ""; // "serena_dashboard" | "zelda_condominio" | "config_geral" | "config_zelda" | "other"
  var serenaDashFilter = "all";
  try {
    var savedDf = localStorage.getItem(DASH_DATE_KEY);
    if (savedDf) serenaDashFilter = savedDf;
  } catch (e) {}
  var cachedDashMetrics = null;
  var cachedZeldaDebugEvents = [];
  var cachedZeldaDiscoveredGroups = [];

  // Auto-conecta runtimeAutoHook.cjs caso o cliente WhatsApp rode em um Electron Renderer com nodeIntegration
  try {
    var __uiNodeReq = typeof window.require === "function" ? window.require : null;
    if (__uiNodeReq && !window.__serenaRendererAutoHookLoaded) {
      window.__serenaRendererAutoHookLoaded = true;
      var __uiPath = __uiNodeReq("path");
      var __uiFs = __uiNodeReq("fs");
      var __uiHookCands = [];
      if (window.process && typeof window.process.cwd === "function") {
        __uiHookCands.push(__uiPath.join(window.process.cwd(), "configuracoes", "runtimeAutoHook.cjs"));
      }
      if (window.process && window.process.resourcesPath) {
        __uiHookCands.push(__uiPath.join(window.process.resourcesPath, "app", "configuracoes", "runtimeAutoHook.cjs"));
        __uiHookCands.push(__uiPath.join(window.process.resourcesPath, "configuracoes", "runtimeAutoHook.cjs"));
      }
      for (var __hi = 0; __hi < __uiHookCands.length; __hi++) {
        if (__uiFs.existsSync(__uiHookCands[__hi])) {
          __uiNodeReq(__uiHookCands[__hi]);
          break;
        }
      }
    }
  } catch (_eRendererHook) {}

  // 0. ESTABILIZADOR ANTI-FLICKER (impede pisca-pisca de re-render/animações no Dashboard)
  function injectAntiFlickerCss() {
    if (document.getElementById("serena-anti-flicker-style")) return;
    var st = document.createElement("style");
    st.id = "serena-anti-flicker-style";
    st.textContent =
      "body.serena-stable-ui [class*='card'], body.serena-stable-ui [class*='stat'], body.serena-stable-ui [class*='kpi'], body.serena-stable-ui [class*='metric'], body.serena-stable-ui [class*='dashboard'] { animation: none !important; transition: background-color 0.15s ease, border-color 0.15s ease !important; }" +
      "[data-serena-managed='1'] { contain: layout style; }";
    (document.head || document.documentElement).appendChild(st);
    setTimeout(function () {
      if (document.body) document.body.classList.add("serena-stable-ui");
    }, 900);
  }
  injectAntiFlickerCss();

  function setTextIfChanged(el, nextText) {
    if (!el) return;
    var s = String(nextText === undefined || nextText === null ? "" : nextText);
    if (el.textContent !== s) el.textContent = s;
  }

  function setColorIfChanged(el, nextColor) {
    if (!el || !nextColor) return;
    if (el.getAttribute("data-serena-col") !== nextColor) {
      el.setAttribute("data-serena-col", nextColor);
      el.style.color = nextColor;
    }
  }

  // Datas em America/Sao_Paulo SEM usar new Date("YYYY-MM-DD") (zero desvio UTC-3!)
  function getBrtIsoDate(offsetDays) {
    var d = new Date(Date.now() + (Number(offsetDays || 0) * 86400000));
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Sao_Paulo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    });
    var parts = fmt.formatToParts(d);
    var map = {};
    for (var i = 0; i < parts.length; i++) map[parts[i].type] = parts[i].value;
    return map.year + "-" + map.month + "-" + map.day;
  }

  function formatIsoPtBr(iso) {
    var m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? (m[3] + "/" + m[2] + "/" + m[1]) : String(iso || "");
  }

  function readNodeJsonCandidates(relSubPath) {
    try {
      var req = typeof window.require === "function" ? window.require : null;
      if (!req) return null;
      var fsMod = req("fs");
      var pathMod = req("path");
      var candidates = [];
      if (window.process && window.process.resourcesPath) {
        candidates.push(pathMod.join(window.process.resourcesPath, "app", relSubPath));
        candidates.push(pathMod.join(window.process.resourcesPath, "..", relSubPath));
      }
      if (window.process && typeof window.process.cwd === "function") {
        candidates.push(pathMod.join(window.process.cwd(), relSubPath));
      }
      if (window.process && window.process.env && window.process.env.APPDATA) {
        candidates.push(pathMod.join(window.process.env.APPDATA, "mm-sender", relSubPath));
      }
      if (window.process && window.process.env && window.process.env.LOCALAPPDATA) {
        candidates.push(pathMod.join(window.process.env.LOCALAPPDATA, "mm-sender", relSubPath));
      }
      var bestParsed = null;
      var bestMtime = -1;
      for (var i = 0; i < candidates.length; i++) {
        try {
          if (fsMod.existsSync(candidates[i])) {
            var st = fsMod.statSync(candidates[i]);
            var parsed = JSON.parse(fsMod.readFileSync(candidates[i], "utf-8"));
            if (parsed !== null && parsed !== undefined && Number(st.mtimeMs || 0) >= bestMtime) {
              bestMtime = Number(st.mtimeMs || 0);
              bestParsed = parsed;
            }
          }
        } catch (errCand) {}
      }
      if (bestParsed !== null) return bestParsed;
    } catch (e) {}
    return null;
  }

  function writeNodeJsonCandidates(relSubPath, data) {
    try {
      var req = typeof window.require === "function" ? window.require : null;
      if (!req) return false;
      var fsMod = req("fs");
      var pathMod = req("path");
      var targets = [];
      if (window.process && window.process.env && window.process.env.APPDATA) {
        targets.push(pathMod.join(window.process.env.APPDATA, "mm-sender", relSubPath));
      }
      if (window.process && typeof window.process.cwd === "function") {
        targets.push(pathMod.join(window.process.cwd(), relSubPath));
      }
      var wrote = false;
      for (var i = 0; i < targets.length; i++) {
        try {
          fsMod.mkdirSync(pathMod.dirname(targets[i]), { recursive: true });
          fsMod.writeFileSync(targets[i], JSON.stringify(data, null, 2), "utf-8");
          wrote = true;
        } catch (errInner) {}
      }
      return wrote;
    } catch (e) {}
    return false;
  }

  function readNodeFsSettings() {
    return readNodeJsonCandidates("configuracoes/clinic-settings.json") || readNodeJsonCandidates("clinic-settings.json");
  }

  function writeNodeFsSettings(data) {
    writeNodeJsonCandidates("clinic-settings.json", data);
    return writeNodeJsonCandidates("configuracoes/clinic-settings.json", data);
  }

  function getCachedSettings() {
    var fromFs = readNodeFsSettings();
    if (fromFs && (fromFs.clinicName || fromFs.clinicAddress || fromFs.address)) {
      return Object.assign({}, SERENA_DEFAULTS, fromFs, {
        clinicName: fromFs.clinicName || SERENA_DEFAULTS.clinicName,
        clinicAddress: fromFs.clinicAddress || fromFs.address || SERENA_DEFAULTS.clinicAddress,
        zeldaGroupTarget: fromFs.zeldaGroupTarget || fromFs.grupoZelda || SERENA_DEFAULTS.zeldaGroupTarget
      });
    }
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        return Object.assign({}, SERENA_DEFAULTS, parsed, {
          clinicName: parsed.clinicName || SERENA_DEFAULTS.clinicName,
          clinicAddress: parsed.clinicAddress || parsed.address || SERENA_DEFAULTS.clinicAddress,
          zeldaGroupTarget: parsed.zeldaGroupTarget || parsed.grupoZelda || SERENA_DEFAULTS.zeldaGroupTarget
        });
      }
    } catch (e) {}
    return Object.assign({}, SERENA_DEFAULTS);
  }

  function detectNativeDomWhatsAppOnline() {
    var badges = document.querySelectorAll("aside span, aside div, header span, header div, nav span, [class*='status'], [class*='badge']");
    for (var i = 0; i < badges.length; i++) {
      var b = badges[i];
      if (b.children.length > 1 || b.closest("[data-serena-managed='1']")) continue;
      var t = (b.textContent || "").replace(/\s+/g, " ").trim();
      if (!t || t.length > 55) continue;
      if (/whatsapp\s+(conectado|online)|sess[aã]o\s+ativa|^conectado$/i.test(t) && !/desconectad|offline|off\s*line/i.test(t)) {
        return true;
      }
    }
    return false;
  }

  function readRealWhatsAppConnection() {
    var rawConn = readNodeJsonCandidates("dados/whatsapp-connection-status.json");
    if (rawConn && typeof rawConn === "object") {
      var age = Date.now() - Number(rawConn.heartbeatEpochMs || 0);
      var isFresh = Boolean(rawConn.connected) && age >= 0 && age <= 180000;
      var ph = String(rawConn.connectedPhone || rawConn.phone || "");
      if (isFresh || detectNativeDomWhatsAppOnline()) {
        liveWaConn = { connected: true, stateLabel: "Conectada (WhatsApp Online)", phone: ph };
      } else {
        liveWaConn = { connected: false, stateLabel: "Desconectada (WhatsApp Offline)", phone: "" };
      }
      return liveWaConn;
    }
    if (detectNativeDomWhatsAppOnline()) {
      liveWaConn = { connected: true, stateLabel: "Conectada (WhatsApp Online)", phone: liveWaConn.phone || "" };
    }
    return liveWaConn;
  }

  function mergeRemoteZeldaActivitiesIntoCache(remoteArr) {
    if (!Array.isArray(remoteArr)) return false;
    var current = getZeldaActivities();
    var localMap = {};
    for (var i = 0; i < current.length; i++) {
      if (current[i] && current[i].id) localMap[String(current[i].id)] = current[i];
    }
    var changed = remoteArr.length !== current.length;
    var merged = [];
    for (var j = 0; j < remoteArr.length; j++) {
      var r = remoteArr[j];
      if (!r || typeof r !== "object") continue;
      var rid = String(r.id || "");
      var loc = rid ? localMap[rid] : null;
      if (loc) {
        var rTs = typeof r.updatedAtEpochMs === "number" ? r.updatedAtEpochMs : 0;
        var lTs = typeof loc.updatedAtEpochMs === "number" ? loc.updatedAtEpochMs : 0;
        if (lTs > 0 && rTs > 0 && lTs > rTs) {
          merged.push(loc);
          continue;
        }
        if (JSON.stringify(loc) !== JSON.stringify(r)) changed = true;
      } else {
        changed = true;
      }
      merged.push(r);
    }
    if (changed) {
      try { localStorage.setItem(ZELDA_TASKS_KEY, JSON.stringify(merged)); } catch (e) {}
      try { window.dispatchEvent(new CustomEvent("zelda-activities-synced")); } catch (e) {}
    }
    return changed;
  }

  function updateZeldaLiveTelemetry(groupsArr, debugArr) {
    var changed = false;
    if (Array.isArray(groupsArr) && JSON.stringify(groupsArr) !== JSON.stringify(cachedZeldaDiscoveredGroups)) {
      cachedZeldaDiscoveredGroups = groupsArr;
      changed = true;
    }
    if (Array.isArray(debugArr) && JSON.stringify(debugArr) !== JSON.stringify(cachedZeldaDebugEvents)) {
      cachedZeldaDebugEvents = debugArr;
      changed = true;
    }
    if (changed) {
      try { window.dispatchEvent(new CustomEvent("zelda-debug-synced")); } catch (e) {}
    }
  }

  async function refreshConnectionAndMetricsFromApis() {
    readRealWhatsAppConnection();
    var fsDbg = readNodeJsonCandidates("dados/zelda-group-debug.json");
    var fsGrps = readNodeJsonCandidates("dados/zelda-discovered-groups.json");
    if (Array.isArray(fsGrps) || Array.isArray(fsDbg)) {
      updateZeldaLiveTelemetry(fsGrps || cachedZeldaDiscoveredGroups, fsDbg || cachedZeldaDebugEvents);
    }
    var syncedActivities = false;
    try {
      var req = typeof window.require === "function" ? window.require : null;
      if (req) {
        var electron = req("electron");
        if (electron && electron.ipcRenderer) {
          var st = await electron.ipcRenderer.invoke("zelda:get-condominio-state");
          if (st && st.connection) {
            var isConn = Boolean(st.connection.connected) || detectNativeDomWhatsAppOnline();
            liveWaConn = {
              connected: isConn,
              stateLabel: isConn ? "Conectada (WhatsApp Online)" : "Desconectada (WhatsApp Offline)",
              phone: String(st.connection.connectedPhone || st.connection.phone || "")
            };
          }
          if (st && Array.isArray(st.activities)) {
            mergeRemoteZeldaActivitiesIntoCache(st.activities);
            syncedActivities = true;
          }
          if (st && (Array.isArray(st.discoveredGroups) || Array.isArray(st.debugEvents))) {
            updateZeldaLiveTelemetry(st.discoveredGroups || cachedZeldaDiscoveredGroups, st.debugEvents || cachedZeldaDebugEvents);
          }
        }
      }
    } catch (e) {}
    try {
      var respApi = await fetch("/api/zelda-condominio/state");
      if (respApi.ok) {
        var jsApi = await respApi.json();
        if (jsApi && Array.isArray(jsApi.activities) && !syncedActivities) {
          mergeRemoteZeldaActivitiesIntoCache(jsApi.activities);
          syncedActivities = true;
        }
        if (jsApi && (Array.isArray(jsApi.discoveredGroups) || Array.isArray(jsApi.debugEvents))) {
          updateZeldaLiveTelemetry(jsApi.discoveredGroups || cachedZeldaDiscoveredGroups, jsApi.debugEvents || cachedZeldaDebugEvents);
        }
      }
    } catch (e) {}
    try {
      var resp = await fetch("http://127.0.0.1:17890/status");
      if (resp.ok) {
        var js = await resp.json();
        if (js && js.whatsappConnection) {
          var daemonConn = Boolean(js.whatsappConnection.connected) || detectNativeDomWhatsAppOnline();
          liveWaConn = {
            connected: daemonConn,
            stateLabel: daemonConn ? "Conectada (WhatsApp Online)" : "Desconectada (WhatsApp Offline)",
            phone: String(js.whatsappConnection.connectedPhone || js.whatsappConnection.phone || "")
          };
        }
        if (js && Array.isArray(js.zeldaActivities) && !syncedActivities) {
          mergeRemoteZeldaActivitiesIntoCache(js.zeldaActivities);
        }
        if (js && (Array.isArray(js.zeldaDiscoveredGroups) || Array.isArray(js.zeldaGroupDebug))) {
          updateZeldaLiveTelemetry(js.zeldaDiscoveredGroups || cachedZeldaDiscoveredGroups, js.zeldaGroupDebug || cachedZeldaDebugEvents);
        }
      }
    } catch (e) {}

    await refreshDashboardMetricsAsync(serenaDashFilter);
    syncAllScreenStates();
  }

  // Lê métricas diárias ou Total Geral da Serena (fuso America/Sao_Paulo)
  async function refreshDashboardMetricsAsync(dateFilter) {
    var targetFilter = dateFilter || "all";
    // 1) Leitura direta via Node (Electron com nodeIntegration)
    try {
      var req = typeof window.require === "function" ? window.require : null;
      if (req && window.process && typeof window.process.cwd === "function") {
        var pathMod = req("path");
        var fsMod = req("fs");
        var engPath = pathMod.join(window.process.cwd(), "configuracoes", "serenaDashboardEngine.cjs");
        if (fsMod.existsSync(engPath)) {
          var dashEng = req(engPath);
          if (dashEng && typeof dashEng.computeDashboardMetrics === "function") {
            cachedDashMetrics = dashEng.computeDashboardMetrics(targetFilter);
            return cachedDashMetrics;
          }
        }
      }
    } catch (eNode) {}

    // 2) Electron IPC
    try {
      var req2 = typeof window.require === "function" ? window.require : null;
      if (req2) {
        var el2 = req2("electron");
        if (el2 && el2.ipcRenderer) {
          var ipcM = await el2.ipcRenderer.invoke("serena:get-dashboard-metrics", targetFilter);
          if (ipcM && typeof ipcM.leadsEntrada === "number") {
            cachedDashMetrics = ipcM;
            return cachedDashMetrics;
          }
        }
      }
    } catch (eIpc) {}

    // 3) API Express interna do mm-sender
    try {
      var rApi = await fetch("/api/serena-dashboard/metrics?date=" + encodeURIComponent(targetFilter));
      if (rApi.ok) {
        var jApi = await rApi.json();
        if (jApi && typeof jApi.leadsEntrada === "number") {
          cachedDashMetrics = jApi;
          return cachedDashMetrics;
        }
      }
    } catch (eApi) {}

    // 4) Daemon PowerShell local 127.0.0.1:17890
    try {
      var rDaemon = await fetch("http://127.0.0.1:17890/dashboard-metrics?date=" + encodeURIComponent(targetFilter));
      if (rDaemon.ok) {
        var jDaemon = await rDaemon.json();
        if (jDaemon && typeof jDaemon.leadsEntrada === "number") {
          cachedDashMetrics = jDaemon;
          return cachedDashMetrics;
        }
      }
    } catch (eDaemon) {}

    return cachedDashMetrics;
  }

  function getZeldaActivities() {
    var fsList = readNodeJsonCandidates("dados/zelda-condominio-atividades.json");
    if (Array.isArray(fsList)) {
      try { localStorage.setItem(ZELDA_TASKS_KEY, JSON.stringify(fsList)); } catch (e) {}
      return fsList;
    }
    try {
      var raw = localStorage.getItem(ZELDA_TASKS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  }

  async function saveZeldaActivities(list, outboxText) {
    var clean = Array.isArray(list) ? list : [];
    try { localStorage.setItem(ZELDA_TASKS_KEY, JSON.stringify(clean)); } catch (e) {}
    writeNodeJsonCandidates("dados/zelda-condominio-atividades.json", clean);
    if (outboxText) {
      var cfg = getCachedSettings();
      var q = readNodeJsonCandidates("dados/zelda-outbox-queue.json");
      var qArr = Array.isArray(q) ? q : [];
      qArr.push({
        id: "out_" + Date.now(),
        targetGroup: cfg.zeldaGroupTarget || "",
        text: outboxText,
        sent: false,
        createdAt: new Date().toLocaleString("pt-BR")
      });
      writeNodeJsonCandidates("dados/zelda-outbox-queue.json", qArr);
    }
    try {
      var req = typeof window.require === "function" ? window.require : null;
      if (req) {
        var electron = req("electron");
        if (electron && electron.ipcRenderer) {
          await electron.ipcRenderer.invoke("zelda:save-activities", { activities: clean, outboxText: outboxText || "" });
        }
      }
    } catch (e) {}
    try {
      await fetch("/api/zelda-condominio/activities", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ activities: clean, outboxText: outboxText || "" })
      });
    } catch (e) {}
    try {
      await fetch("http://127.0.0.1:17890/zelda-activities", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ activities: clean, outboxText: outboxText || "" })
      });
    } catch (e) {}
    return clean;
  }

  function formatWhatsAppList(activities, groupName) {
    var open = activities.filter(function (a) { return a.status !== "concluida" && a.status !== "reprovada"; });
    var stamp = new Date().toLocaleString("pt-BR");
    var grp = groupName || "Grupo Configurado";
    var cfg = getCachedSettings();
    var quorum = Math.max(1, Number(cfg.zeldaApprovalQuorum) || 3);
    if (!open.length) {
      return "📋 *INICIATIVAS DO CONDOMÍNIO — " + grp + "*\n_Atualizado em " + stamp + "_\n\n✅ Nenhuma iniciativa em aberto no momento.\n_Para incluir pelo grupo: *Zelda Inserir Iniciativa*_";
    }
    var lines = [
      "📋 *INICIATIVAS DO CONDOMÍNIO — " + grp + "*",
      "_Atualizado em " + stamp + " · Total em aberto: " + open.length + "_",
      ""
    ];
    for (var i = 0; i < open.length; i++) {
      var it = open[i];
      var icon = it.status === "em_votacao" ? "🗳️" : (it.status === "aprovada" ? "☑️" : (it.status === "em_andamento" ? "🔄" : "⏳"));
      var stTxt = it.status === "em_votacao" ? "Em votação" : (it.status === "aprovada" ? "Aprovada" : (it.status === "em_andamento" ? "Em andamento" : "Pendente"));
      var row = icon + " *#" + it.code + "* — " + it.title;
      var meta = ["Status: " + stTxt];
      if (it.area) meta.push("Local: " + it.area);
      if (it.responsible) meta.push("Resp: " + it.responsible);
      if (it.dueDate) meta.push("Prazo: " + it.dueDate);
      if (Array.isArray(it.votes) && (it.votes.length > 0 || it.status === "em_votacao")) {
        var fav = it.votes.filter(function (v) { return v.choice === "favor"; }).length;
        var con = it.votes.filter(function (v) { return v.choice === "contra"; }).length;
        meta.push("Votos: " + fav + "/" + quorum + " favor · " + con + " contra");
      }
      if (meta.length) row += "\n   └ _" + meta.join(" · ") + "_";
      if (it.notes) row += "\n   📝 " + it.notes;
      lines.push(row);
    }
    lines.push("");
    lines.push("💬 *Comandos no grupo:* Zelda Inserir Iniciativa · Zelda Alterar data · Zelda Votar · Zelda Concluir · Zelda Lista");
    return lines.join("\n");
  }

  async function loadLatestSettingsAsync() {
    var current = getCachedSettings();
    try {
      var syncResp = await fetch("http://127.0.0.1:17890/status");
      if (syncResp.ok) {
        var syncJson = await syncResp.json();
        if (syncJson && syncJson.settings && syncJson.settings.clinicName) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(syncJson.settings));
          return syncJson.settings;
        }
      }
    } catch (e) {}
    return current;
  }

  async function persistSettingsEverywhere(payload) {
    var base = getCachedSettings();
    var aName = String(payload.assistantName !== undefined ? payload.assistantName : (base.assistantName || "Serena")).trim() || "Serena";
    var cName = String(payload.clinicName !== undefined ? payload.clinicName : base.clinicName).trim() || SERENA_DEFAULTS.clinicName;
    var cAddr = String(payload.clinicAddress !== undefined ? payload.clinicAddress : (payload.address || base.clinicAddress)).trim() || SERENA_DEFAULTS.clinicAddress;
    var cPark = String(payload.parkingInfo !== undefined ? payload.parkingInfo : (base.parkingInfo || "")).trim();
    var rName = String(payload.receptionName !== undefined ? payload.receptionName : (base.receptionName || "Recepção")).trim() || "Recepção";
    var rWa = String(payload.receptionWhatsapp !== undefined ? payload.receptionWhatsapp : (base.receptionWhatsapp || "")).trim();
    var crcOn = payload.crcEnabled !== undefined ? Boolean(payload.crcEnabled) : (base.crcEnabled !== false);
    var zGrp = String(payload.zeldaGroupTarget !== undefined ? payload.zeldaGroupTarget : (base.zeldaGroupTarget || "")).trim();
    var zCaretaker = String(payload.zeldaCaretakerPhone !== undefined ? payload.zeldaCaretakerPhone : (base.zeldaCaretakerPhone || "")).trim();

  function isDarkBackground(el) {

      tag === "MAIN" || tag === "UL" || tag === "OL" || tag === "MENU" ||
      tag === "BUTTON" || tag === "A" || tag === "SELECT" || tag === "INPUT" ||
      tag === "TEXTAREA" || tag === "FORM"

      return true;
    }

      "nav, aside, header, [role='navigation'], [role='tablist'], [role='menubar'], [role='menu'], [role='tab'], " +
      "[class*='sidebar'], [class*='side-bar'], [class*='sidenav'], [class*='navbar'], [class*='topbar'], " +
      "[class*='menu'], [class*='nav-'], [class*='-nav'], [class*='tab-bar'], [class*='tabs'], [class*='drawer'], " +
      "[id*='sidebar'], [id*='sidenav'], [id*='menu'], [id*='navbar'], [id*='tabs'], [data-serena-managed='1']";

    );

      var c = explicitContainers[i];
      if (c.id === "serena-guaranteed-top-menu" || c.closest("[data-serena-managed='1']")) continue;
      var items = c.querySelectorAll("button, a, [role='tab'], li");
      if (items.length >= 2) return c;
    }

    // Fallback para sidebars/menus feitos apenas com <div> + <button>/<a> (ex: Tailwind flex-col w-64)
    var flexDivs = document.querySelectorAll("body > div > div, #root > div > div, #app > div > div, header div");
    for (var j = 0; j < flexDivs.length; j++) {
      var d = flexDivs[j];

      var btns = d.querySelectorAll("button, a");
      if (btns.length < 2 || btns.length > 25) continue;

      for (var b = 0; b < btns.length; b++) {
        var bTxt = (btns[b].textContent || "").replace(/\s+/g, " ").trim();
        if (bTxt.length > 0 && bTxt.length <= 40 && /(dashboard|serena|painel|whatsapp|conex|qr\s*code|disparo|campanha|massa|contato|lead|agenda|zelda|configura|ajuste|settings|mensagen|conversa)/i.test(bTxt)) {

  function isNavOrTabElement(el) {

  function isActiveTabElement(tabEl) {

  function findVisibleMainPanel(excludeEl) {

  // Descobre abas/painéis estáticos nativos (ex: #tab-dashboard, #tab-disparo, [data-tab-content], .tab-pane)
  function discoverNativeDomPanels() {
    var list = [];
    var seen = {};
    var panels = document.querySelectorAll("[id^='tab-'], [id^='aba-'], [data-tab-content], [data-page], .tab-pane");
    for (var i = 0; i < panels.length; i++) {
      var p = panels[i];
      if (isNavigationOrStructuralNode(p) && p.tagName !== "SECTION" && p.tagName !== "DIV") continue;
      if (p.closest("nav, aside, header, [data-serena-managed='1']")) continue;
      var rawKey =
        p.getAttribute("data-tab-content") ||
        p.getAttribute("data-page") ||
        (p.id || "").replace(/^(tab-|aba-)/i, "");
      if (!rawKey) continue;
      var normKey = rawKey.toLowerCase();
      if (seen[normKey]) continue;
      seen[normKey] = true;
      var heading = p.querySelector("h1, h2, h3");
      var niceLabel = heading ? (heading.textContent || "").replace(/\s+/g, " ").trim() : "";
      if (!niceLabel || niceLabel.length > 28) {
        niceLabel = rawKey.charAt(0).toUpperCase() + rawKey.slice(1).replace(/[-_]+/g, " ");
      }
      list.push({ key: normKey, label: niceLabel, panel: p });
    }
    return list;
  }

  function activateNativeDomPanelByKey(targetKey) {
    var panels = discoverNativeDomPanels();
    for (var i = 0; i < panels.length; i++) {

      if (item.key === targetKey) {
        item.panel.hidden = false;
        item.panel.style.display = "";
        item.panel.classList.add("active");
      } else {
        item.panel.classList.remove("active");
        if (item.panel.style && item.panel.id) {

  function mapLabelToCanonicalSection(lbl) {
    var clean = String(lbl || "").replace(/\s+/g, " ").trim();
    if (!clean) return "other";
    if (/config\s*zelda/i.test(clean)) return "config_zelda";
    if (/\b(configura[cç][oõ]es|configura[cç][aã]o|config\s*geral|settings|ajustes|par[aâ]metros)\b/i.test(clean)) {
      return activeSettingsScreen === "zelda" ? "config_zelda" : "config_geral";
    }
    if (/\bagendamento/i.test(clean)) return "agendamentos";
    if (/disparos?\s+em\s+massa|campanha/i.test(clean)) return "disparos_massa";
    if (/\bcontatos?\b/i.test(clean)) return "contatos";
    if (/\bmensagen/i.test(clean)) return "mensagens";
    if (/\bassociac|\bassociaç/i.test(clean)) return "associacoes";
    if (/^disparar$/i.test(clean)) return "disparar";
    if (/^status$/i.test(clean)) return "status";
    if (/\b(zelda|condom[ií]nio|conselho)\b/i.test(clean)) return "zelda_condominio";
    if (/\b(dashboard|serena|painel|vis[aã]o\s*geral|indicadores|in[ií]cio|home)\b/i.test(clean)) return "serena_dashboard";
    return "other";
  }

  function tryActivateAnyNativePanel(keys) {
    if (!Array.isArray(keys)) return false;
    var panels = discoverNativeDomPanels();
    for (var k = 0; k < keys.length; k++) {

      for (var i = 0; i < panels.length; i++) {
        if (panels[i].key === target || panels[i].key.indexOf(target) >= 0) {
          activateNativeDomPanelByKey(panels[i].key);
          return true;
        }
      }
    }
    return false;
  }

  // Detecta com precisão qual das 10 telas está ativa no mm-sender
  function detectActiveSection() {
    if (lastClickedSection) {
      return lastClickedSection;
    }

    var pNav = findPrimaryNavigationContainer();
    var navItems = pNav
      ? pNav.querySelectorAll("button, a, [role='tab'], li")
      : document.querySelectorAll("nav button, nav a, aside button, aside a, [role='tab'], header button, header a, [class*='sidebar'] button, [class*='sidebar'] a");

    for (var i = 0; i < navItems.length; i++) {
      var it = navItems[i];
      if (!isActiveTabElement(it)) continue;
      var txt = (it.textContent || "").replace(/\s+/g, " ").trim();
      if (!txt || txt.length > 48) continue;
      return mapLabelToCanonicalSection(txt);
    }

    var mainHeadings = document.querySelectorAll("main h1, main h2, [role='tabpanel']:not([hidden]) h1, [role='tabpanel']:not([hidden]) h2, h1, h2");
    for (var j = 0; j < mainHeadings.length; j++) {
      var h = mainHeadings[j];
      if (isNavigationOrStructuralNode(h)) continue;
      if (h.offsetHeight <= 0) continue;
      var hTxt = (h.textContent || "").replace(/\s+/g, " ").trim();

    return "serena_dashboard";

  function cloneMenuButtonWithLabel(templateEl, newId, newLabel, onClickFn) {
    var clone = templateEl.cloneNode(true);
    clone.id = newId;
    clone.removeAttribute("aria-selected");
    clone.setAttribute("data-serena-managed", "1");
    if (clone.className && typeof clone.className === "string") {
      clone.className = clone.className.replace(/\b(active|selected|current)\b/gi, "").trim();
    }
    var updated = false;
    for (var i = 0; i < clone.childNodes.length; i++) {
      var n = clone.childNodes[i];
      if (n.nodeType === 3 && (n.nodeValue || "").trim().length > 1) {
        n.nodeValue = " " + newLabel + " ";
        updated = true;
        break;
      } else if (n.nodeType === 1 && n.children.length === 0 && (n.tagName || "").toUpperCase() !== "SVG" && (n.tagName || "").toUpperCase() !== "I" && (n.textContent || "").trim().length > 1) {
        n.textContent = newLabel;
        updated = true;
        break;
      }
    }
    if (!updated) {
      clone.textContent = newLabel;
    }
    clone.addEventListener("click", onClickFn);
    return clone;
  }

  // Garante TODOS OS 10 ITENS EXATOS no menu nativo OU monta a barra superior completa com os 10 itens!
  function ensureAllNavigationMenuOptions() {
    restoreHiddenNavigationContainers();
    var pNav = findPrimaryNavigationContainer();

    if (pNav && pNav.offsetHeight > 20 && pNav.offsetWidth > 60) {
      var fallbackBar = document.getElementById("serena-guaranteed-top-menu");
      if (fallbackBar) fallbackBar.remove();

      var navCandidates = pNav.querySelectorAll("button, a, [role='tab']");
      var firstTemplateBtn = null;

      for (var i = 0; i < navCandidates.length; i++) {
        var el = navCandidates[i];
        var txt = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (!txt || txt.length > 44) continue;
        if (!firstTemplateBtn && !el.getAttribute("data-serena-managed")) {
          firstTemplateBtn = el;
        }
        for (var r = 0; r < REQUIRED_10_MENU_ITEMS.length; r++) {
          var reqItem = REQUIRED_10_MENU_ITEMS[r];
          if (!matchedMap[reqItem.id] && reqItem.rx.test(txt)) {
            if (reqItem.id === "zelda_condominio" && /config/i.test(txt)) continue;
            matchedMap[reqItem.id] = el;
          }
        }
      }

      if (!firstTemplateBtn) return;

      var parentList = firstTemplateBtn.parentElement;
      if (!parentList) return;

      var curSec = detectActiveSection();

      // Garante que qualquer um dos 10 itens ausente no menu nativo seja inserido mantendo a ordem!
      for (var m = 0; m < REQUIRED_10_MENU_ITEMS.length; m++) {
        (function (spec) {
          var existingEl = matchedMap[spec.id] || document.getElementById("serena-nav-req-" + spec.id);
          if (!existingEl) {
            var newBtn = cloneMenuButtonWithLabel(
              firstTemplateBtn,
              "serena-nav-req-" + spec.id,
              spec.label,
              function (ev) {
                ev.preventDefault();
                ev.stopPropagation();
                if (spec.id === "config_geral") activeSettingsScreen = "geral";
                lastClickedSection = spec.id;
                tryActivateAnyNativePanel(spec.nativeKeys);
                scheduleCheck();
              }
            );
            parentList.appendChild(newBtn);
            existingEl = newBtn;
          } else if (!existingEl.getAttribute("data-serena-nav-bound")) {
            existingEl.setAttribute("data-serena-nav-bound", "1");
            existingEl.addEventListener("click", function () {
              if (spec.id === "config_geral") activeSettingsScreen = "geral";
              lastClickedSection = spec.id;
              scheduleCheck();
            });
          }

          if (existingEl.id === "serena-nav-req-" + spec.id) {
            var isAct =
              spec.id === "config_geral"
                ? curSec === "config_geral" || curSec === "config_zelda"
                : curSec === spec.id;
            existingEl.style.fontWeight = isAct ? "700" : "";
            existingEl.style.opacity = isAct ? "1" : "0.88";
          }
        })(REQUIRED_10_MENU_ITEMS[m]);
      }
      return;
    }

    // CONTINGÊNCIA TOTAL: Monta barra de navegação com os 10 itens exatos do mm-sender!
    mountGuaranteedFullMenuBar();
  }

  function mountGuaranteedFullMenuBar() {

      document.body.insertBefore(bar, document.body.firstChild);
    }

    var sig = curSec + "::" + activeSettingsScreen;
    if (bar.getAttribute("data-menu-sig") === sig) return;
    bar.setAttribute("data-menu-sig", sig);

    var buttonsHtml = "";
    for (var m = 0; m < REQUIRED_10_MENU_ITEMS.length; m++) {

      var isAct =
        opt.id === "config_geral"

          : curSec === opt.id;

  // REGRA OBRIGATÓRIA: Na tela da Serena / Dashboard NÃO deve aparecer nenhum status da Zelda,
  // MAS NUNCA pode ocultar menus, sidebars, cabeçalhos, botões ou links de navegação!
  function syncZeldaStatusVisibilityAndLabels(activeSec) {
    var onZeldaScreen = activeSec === "zelda_condominio" || activeSec === "config_zelda";

    if (!onZeldaScreen) {
      var candidates = document.querySelectorAll("span, p, small, strong, b, div");
      for (var i = 0; i < candidates.length; i++) {
        var el = candidates[i];
        if (isNavigationOrStructuralNode(el)) continue;
        if (el.children.length > 2) continue;
        if (el.offsetHeight > 95) continue;

        var txt = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (!txt || txt.length > 135) continue;

        var isZeldaStatusBadge =
          (/(grupo\s+de\s+whatsup|whatsup\s+off\s*line)/i.test(txt)) ||
          (/^ativa\s*\([^)]*(conselho|zelda|teste)[^)]*\)$/i.test(txt)) ||
          (/\bzelda\b/i.test(txt) && /(desconectad[ao]|conectad[ao]|whatsapp\s+off|whatsup\s+off|status\s+da\s+zelda|grupo\s+configurado)/i.test(txt));

        if (isZeldaStatusBadge) {
          var targetHide = el;
          if (
            el.parentElement &&
            !isNavigationOrStructuralNode(el.parentElement) &&
            el.parentElement.children.length <= 2 &&
            el.parentElement.offsetHeight <= 95 &&
            (el.parentElement.textContent || "").trim().length <= 135
          ) {
            targetHide = el.parentElement;
          }
          if (targetHide.getAttribute("data-serena-zelda-hidden-on-serena") !== "1") {
            targetHide.setAttribute("data-serena-zelda-hidden-on-serena", "1");
            targetHide.style.display = "none";
          }
        }
      }
      return;
    }

    // Nas telas da Zelda: restaura elementos da Zelda e corrige o texto de status real do WhatsApp
    var hiddenList = document.querySelectorAll("[data-serena-zelda-hidden-on-serena='1']");
    for (var r = 0; r < hiddenList.length; r++) {
      hiddenList[r].removeAttribute("data-serena-zelda-hidden-on-serena");
      hiddenList[r].style.display = "";
    }

    var cfg = getCachedSettings();
    var grp = cfg.zeldaGroupTarget || "Não configurado";
    var connText = liveWaConn.connected ? "Conectada (WhatsApp Online)" : "Desconectada (WhatsApp Offline)";
    var nodes = document.querySelectorAll("span, div, p, strong, b, small, td, label");
    for (var n = 0; n < nodes.length; n++) {
      var node = nodes[n];
      if (node.children.length > 0) continue;
      if (isNavigationOrStructuralNode(node)) continue;
      var t = (node.textContent || "").trim();
      if (!t || t.length > 120) continue;
      if (
        /^ativa\s*\([^)]+\)$/i.test(t) ||
        /desconectad[ao].*(grupo|whatsup|whatsapp).*configurado/i.test(t) ||
        /(whatsup|whatsapp)\s*off\s*line.*configurado/i.test(t) ||
        node.getAttribute("data-zelda-status-fixed") === "1"
      ) {
        node.setAttribute("data-zelda-status-fixed", "1");
        setTextIfChanged(node, connText + " · Grupo Configurado: " + grp);
        setColorIfChanged(node, liveWaConn.connected ? "#059669" : "#dc2626");
        node.style.fontWeight = "600";
      }
    }
  }

  // CONTADORES DO DASHBOARD DA SERENA POR DATA + "TODOS OS DIAS (TOTAL GERAL)" (Zero Flicker)
  function findSerenaDashboardContainer(activeSec) {
    if (activeSec !== "serena_dashboard") return null;
    var explicit = ["#tab-dashboard", "#dashboard", "#tab-serena", "#serena-dashboard", "[data-tab-content='dashboard']", "[data-page='dashboard']"];
    for (var i = 0; i < explicit.length; i++) {
      var f = document.querySelector(explicit[i]);
      if (f && f.offsetHeight > 50 && !f.closest("nav, aside, [role='tablist']")) return f;
    }
    return findVisibleMainPanel(null);
  }

  function applyMetricsToNativeDashboardDom(panelEl, metrics) {
    if (!panelEl || !metrics) return;
    // Sincroniza eventual <input type="date"> nativo sem deixar polling sobrescrever a escolha
    var nativeDateInputs = panelEl.querySelectorAll("input[type='date']");
    for (var d = 0; d < nativeDateInputs.length; d++) {
      var di = nativeDateInputs[d];
      if (di.id === "serena-dash-date-input") continue;
      if (di.getAttribute("data-serena-bound-date") !== "1") {
        di.setAttribute("data-serena-bound-date", "1");
        di.addEventListener("change", function () {
          setDashboardFilterValue(this.value ? this.value : "all");
        });
      }
      var desiredVal = serenaDashFilter === "all" ? "" : serenaDashFilter;
      if (document.activeElement !== di && di.value !== desiredVal) {
        di.value = desiredVal;
      }
    }

    // Atualiza contadores numéricos dos cards KPI nativos de forma idempotente (sem piscar!)
    var cards = panelEl.querySelectorAll("[class*='card'], [class*='stat'], [class*='kpi'], [class*='metric'], section > div > div");
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.closest("[data-serena-managed='1']")) continue;
      if (card.children.length < 1 || card.children.length > 6) continue;
      var cardTxt = (card.textContent || "").replace(/\s+/g, " ").trim();
      if (!cardTxt || cardTxt.length > 160) continue;

      var numEl = null;
      var subCandidates = card.querySelectorAll("h1, h2, h3, strong, b, span, div, p");
      for (var k = 0; k < subCandidates.length; k++) {
        var sc = subCandidates[k];
        if (sc.children.length > 0) continue;
        var st = (sc.textContent || "").trim();
        if (/^\d+(?:[.,]\d+)?%?$/.test(st)) {
          numEl = sc;
          break;
        }
      }
      if (!numEl) continue;

      var low = cardTxt.toLowerCase();
      var isPct = (numEl.textContent || "").trim().endsWith("%");
      if (/convers[aã]o|taxa/i.test(low) || isPct) {
        setTextIfChanged(numEl, String(metrics.taxaConversao) + "%");
      } else if (/agendad|avalia[cç][oõ]es\s+confirm|consultas\s+marcadas/i.test(low)) {
        setTextIfChanged(numEl, String(metrics.agendados));
      } else if (/transbordo|humano|atendente/i.test(low)) {
        setTextIfChanged(numEl, String(metrics.transbordoHumano));
      } else if (/n[aã]o\s+lid/i.test(low)) {
        setTextIfChanged(numEl, String(metrics.naoLidas));
      } else if (/respondid|mensagens\s+enviadas|respostas\s+serena/i.test(low)) {
        setTextIfChanged(numEl, String(metrics.mensagensRespondidas));
      } else if (/entrada\s+de\s+leads|novos\s+leads|total\s+de\s+leads|\bleads\b|atendimentos\s+ativos/i.test(low)) {
        setTextIfChanged(numEl, String(metrics.leadsEntrada));
      }
    }

    // Atualiza também o resumo na barra de período da Serena
    var summaryEl = document.getElementById("serena-dash-period-summary");
    if (summaryEl) {
      var labelPeriod = serenaDashFilter === "all" ? "Todos os dias (Total Geral)" : formatIsoPtBr(serenaDashFilter);
      var fObj = metrics.funil || {};
      var recCnt = typeof fObj.leads_recebidos === "number" ? fObj.leads_recebidos : metrics.leadsEntrada;
      var agCnt = typeof fObj.leads_agendados === "number" ? fObj.leads_agendados : metrics.agendados;
      setTextIfChanged(
        summaryEl,
        labelPeriod + " · Leads: " + recCnt + " · Agendados: " + agCnt + " · Conversão: " + (metrics.taxaConversao || 0) + "%"
      );
    }

    renderCorporateSerenaDashboardCard(panelEl, metrics);
  }

        kpiBox("1. Leads Recebidos", funil.leads_recebidos) +

        kpiBox("4. Ofertas Horário", funil.ofertas_agendamento, "#2563eb") +

  function restoreVirtualZeldaIsolation() {
    var hiddenEls = document.querySelectorAll("[data-serena-zelda-view-hidden]");
    for (var i = 0; i < hiddenEls.length; i++) {
      hiddenEls[i].removeAttribute("data-serena-zelda-view-hidden");
      hiddenEls[i].style.display = "";
    }
  }

  function applyVirtualZeldaIsolation(container, mode) {
    if (!container || mode !== "virtual-main") return;
    var pNav = findPrimaryNavigationContainer();
    var children = container.children;
    for (var i = 0; i < children.length; i++) {
      var ch = children[i];
      if (ch.getAttribute("data-serena-managed") === "1") continue;
      if (pNav && (ch === pNav || ch.contains(pNav))) continue;
      var tag = (ch.tagName || "").toUpperCase();
      if (tag === "NAV" || tag === "ASIDE" || tag === "HEADER") continue;
      if (ch.matches && ch.matches("[role='navigation'], [role='tablist'], [class*='sidebar'], [class*='navbar'], [class*='tabs'], [class*='menu']")) continue;
      ch.setAttribute("data-serena-zelda-view-hidden", "1");
      ch.style.display = "none";
    }
  }

  // ZELDA (CONDOMÍNIO) CARD — Montado EXCLUSIVAMENTE na aba Zelda (Condomínio), nunca na Serena!
  function escZeldaHtml(val) {
    return String(val == null ? "" : val)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  var escHtml = escZeldaHtml;

  function findZeldaTabContainer(activeSec) {
    if (activeSec !== "zelda_condominio") return null;
    var explicit = ["#tab-zelda", "#zelda", "#aba-zelda", "#zelda-condominio", "[data-tab-content='zelda']", "[data-page='zelda']"];
    for (var i = 0; i < explicit.length; i++) {
      var f = document.querySelector(explicit[i]);
      if (f && !f.closest("nav, aside, [role='tablist']")) {
        if (f.hidden) f.hidden = false;
        if (f.style && f.style.display === "none") f.style.display = "";
        return { container: f, mode: "static-panel" };
      }
    }
    var mainP = findVisibleMainPanel(null);
    return mainP ? { container: mainP, mode: "virtual-main" } : null;
  }

    function isUiBlank(val) {
      var s = String(val || "").trim().toLowerCase();
      return !s || s === "-" || s === "--" || s === "em branco" || s === "pular" || s === "vazio" || s === "nenhum" || s === "nenhuma" || s === "sem" || s === "n/a";
    }

    function validateZeldaUiForm(raw) {
      var title = String(raw.title || "").replace(/\s+/g, " ").trim();
      if (!title || isUiBlank(title)) {
        return { ok: false, error: "O nome/descrição da iniciativa é obrigatório e não pode ficar vazio." };
      }
      if (title.length < 4 || title.length > 160 || (title.match(/[A-Za-zÀ-ÿ]/g) || []).length < 3 || /^\d{1,2}[/.-]\d{1,2}(?:[/.-]\d{2,4})?$/.test(title)) {
        return { ok: false, error: "Informe um nome válido para a iniciativa (entre 4 e 160 caracteres, com texto descritivo)." };
      }

      var area = isUiBlank(raw.area) ? "" : String(raw.area || "").replace(/\s+/g, " ").trim();
      if (area) {
        if (area.length < 2 || area.length > 80 || (area.match(/[A-Za-zÀ-ÿ]/g) || []).length < 1 || /^\d{1,2}[/.-]\d{1,2}(?:[/.-]\d{2,4})?$/.test(area)) {
          return { ok: false, error: "Área/Local inválida. Informe o local (ex.: Portaria, Área comum) ou deixe o campo sem informação." };
        }
      }

      var responsible = isUiBlank(raw.responsible) ? "" : String(raw.responsible || "").replace(/\s+/g, " ").trim();
      if (responsible) {
        var respDigits = (responsible.match(/\d/g) || []).length;
        if (responsible.length < 2 || responsible.length > 80 || (responsible.match(/[A-Za-zÀ-ÿ]/g) || []).length < 2 || respDigits >= 8 || /^\d{1,2}[/.-]\d{1,2}(?:[/.-]\d{2,4})?$/.test(responsible)) {
          return { ok: false, error: "Responsável inválido. Informe o nome/cargo (evite apenas números ou datas) ou deixe sem informação." };
        }
      }

      var dueRaw = isUiBlank(raw.dueDate) ? "" : String(raw.dueDate || "").replace(/\s+/g, " ").trim();
      var dueDate = "";
      if (dueRaw) {
        var brM = dueRaw.match(/^(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2}|\d{4}))?$/);
        var isoM = !brM ? dueRaw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/) : null;
        var dd = 0, mm = 0, yy = 0;
        if (brM) {
          dd = Number(brM[1]);
          mm = Number(brM[2]);
          yy = !brM[3] ? new Date().getFullYear() : (brM[3].length === 2 ? 2000 + Number(brM[3]) : Number(brM[3]));
        } else if (isoM) {
          yy = Number(isoM[1]);
          mm = Number(isoM[2]);
          dd = Number(isoM[3]);
        } else {
          return { ok: false, error: "Data/Prazo inválido. Use o formato DD/MM/AAAA (ex.: 25/11/2026) ou deixe o campo em branco." };
        }
        var leap = (yy % 4 === 0 && yy % 100 !== 0) || (yy % 400 === 0);
        var maxD = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        if (yy < 2020 || yy > 2039 || mm < 1 || mm > 12 || dd < 1 || dd > maxD[mm - 1]) {
          return { ok: false, error: "A data informada (" + dueRaw + ") não existe no calendário. Corrija ou deixe sem informação." };
        }
        dueDate = (dd < 10 ? "0" + dd : "" + dd) + "/" + (mm < 10 ? "0" + mm : "" + mm) + "/" + yy;
      }

      var notes = isUiBlank(raw.notes) ? "" : String(raw.notes || "").replace(/\s+/g, " ").trim();
      if (notes) {
        if (notes.length > 500 || (notes.match(/[A-Za-zÀ-ÿ0-9]/g) || []).length < 2) {
          return { ok: false, error: "Observação inválida (use até 500 caracteres com texto válido ou deixe em branco)." };
        }
      }

      return { ok: true, title: title, area: area, responsible: responsible, dueDate: dueDate, notes: notes };
    }

    function submitNewInitiative() {
      var tIn = document.getElementById("zc-title-in");
      var aIn = document.getElementById("zc-area-in");
      var rIn = document.getElementById("zc-resp-in");
      var dIn = document.getElementById("zc-due-in");
      var pIn = document.getElementById("zc-prio-in");
      var sIn = document.getElementById("zc-status-in");
      var nIn = document.getElementById("zc-notes-in");
      var checked = validateZeldaUiForm({
        title: tIn ? tIn.value : "",
        area: aIn ? aIn.value : "",
        responsible: rIn ? rIn.value : "",
        dueDate: dIn ? dIn.value : "",
        notes: nIn ? nIn.value : ""
      });
      if (!checked.ok) {
        showFb(checked.error, true);
        if (tIn && !tIn.value.trim()) tIn.focus();
        return;
      }
      var cur = getZeldaActivities();
      var maxCode = cur.reduce(function (m, it) { return Math.max(m, Number(it.code || 0)); }, 0);
      var newCode = maxCode + 1;
      var chosenStatus = sIn ? sIn.value : "pendente";
      var now = new Date().toLocaleString("pt-BR");
      cur.push({
        id: "zc_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
        code: newCode,
        title: checked.title,
        area: checked.area,
        responsible: checked.responsible,
        priority: pIn ? pIn.value : "media",
        status: chosenStatus,
        dueDate: checked.dueDate,
        notes: checked.notes,
        votes: [],
        createdAt: now,
        updatedAt: now,
        updatedAtEpochMs: Date.now(),
        updatedBy: "Painel mm-sender"
      });
      if (chosenStatus === "concluida" || chosenStatus === "reprovada") {
        currentFilter = "concluidas";
      } else if (currentFilter === "concluidas") {
        currentFilter = "abertas";
      }
      clearCreateInputs();
      saveZeldaActivities(cur).then(function () {
        renderTasks();
        showFb("Iniciativa #" + newCode + " incluída e sincronizada!", false);
      });
    }

    var addBtn = document.getElementById("zc-add-btn");
    if (addBtn) {
      addBtn.addEventListener("click", submitNewInitiative);
    }
    var titleInEl = document.getElementById("zc-title-in");
    if (titleInEl) {
      titleInEl.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {

    var copyBtn = document.getElementById("zc-copy-btn");

    }

    var sendBtn = document.getElementById("zc-send-grp-btn");

      sendBtn.addEventListener("click", function () {

        saveZeldaActivities(getZeldaActivities(), txt).then(function () {
          showFb("Lista enfileirada para envio imediato no grupo " + c.zeldaGroupTarget + "!", false);
        });
      });
    }
  }

  // TELAS SEPARADAS DE CONFIGURAÇÕES: "Config Geral" e "Config Zelda"
  function findSettingsTabContainer(activeSec) {
    if (activeSec !== "config_geral" && activeSec !== "config_zelda") return null;
    var explicitSelectors = [
      "#tab-configuracoes", "#tab-config", "#configuracoes", "#config",
      "#aba-configuracoes", "#aba-config", "#settings-tab", "#tab-settings", "#settings",
      "[data-tab-content='configuracoes']", "[data-tab-content='config']", "[data-tab-content='settings']"
    ];
    for (var i = 0; i < explicitSelectors.length; i++) {
      var found = document.querySelector(explicitSelectors[i]);
      if (found && !found.closest("nav, aside, [role='tablist']")) {
        return { container: found, mode: "static-panel" };
      }
    }

    var headings = document.querySelectorAll("h1, h2, h3, h4, legend");
    for (var j = 0; j < headings.length; j++) {
      var h = headings[j];
      if (h.closest("nav, aside, button, a, [role='tab'], [data-serena-managed='1']")) continue;
      var txt = (h.textContent || "").replace(/\s+/g, " ").trim();
      if (txt.length > 0 && txt.length <= 55 && /^(?:⚙️\s*)?(?:configura[cç][oõ]es|configura[cç][aã]o|config\s*geral|config\s*zelda|ajustes|par[aâ]metros)\b/i.test(txt)) {
        var panel = h.closest("form, section, main, [role='tabpanel']") || h.parentElement;
        if (panel && panel.offsetHeight > 40) return { container: panel, anchorHeading: h, mode: "dynamic-heading" };
      }
    }

    var mainPanel = findVisibleMainPanel(null);
    return mainPanel ? { container: mainPanel, mode: "virtual-main" } : null;
  }

  function restoreSettingsSplitVisibility() {
    var hiddenEls = document.querySelectorAll("[data-serena-split-hidden]");

  function applySettingsScreenIsolation(container, mode, mountMode) {
    if (!container) return;
    restoreSettingsSplitVisibility();
    var pNav = findPrimaryNavigationContainer();
    var children = container.children;
    for (var i = 0; i < children.length; i++) {
      var ch = children[i];
      if (ch.getAttribute("data-serena-managed") === "1") continue;
      // NUNCA esconde barras de navegação, sidebars ou cabeçalhos!
      if (pNav && (ch === pNav || ch.contains(pNav))) continue;
      var tag = (ch.tagName || "").toUpperCase();
      if (tag === "NAV" || tag === "ASIDE" || tag === "HEADER") continue;
      if (ch.matches && ch.matches("[role='navigation'], [role='tablist'], [class*='sidebar'], [class*='navbar'], [class*='tabs'], [class*='menu']")) continue;
      if (ch.querySelector && ch.querySelector("nav, aside, [role='navigation'], [role='tablist'], [class*='sidebar']")) continue;

      var txt = (ch.textContent || "").replace(/\s+/g, " ").trim();
      if (mode === "zelda" || mountMode === "virtual-main") {
        // Em Config Zelda ou modo virtual, exibe a tela limpa correspondente sem afetar o menu!
        ch.setAttribute("data-serena-split-hidden", mode);
        ch.style.display = "none";
      } else {
        // Na tela nativa Config Geral, oculta apenas eventuais blocos pequenos exclusivos da Zelda
        if (/\b(zelda|zelador|qu[oó]rum)\b/i.test(txt) && txt.length < 600 && !isNavigationOrStructuralNode(ch)) {
          ch.setAttribute("data-serena-split-hidden", "zelda");
          ch.style.display = "none";
        }
      }
    }
  }

  var MM_OP_STORE_KEY = "mm_sender_operacional_v1";

  function loadLocalOpStore() {
    var fsObj = readNodeJsonCandidates("dados/mm-sender-operacional.json");
    if (fsObj && typeof fsObj === "object") {
      try { localStorage.setItem(MM_OP_STORE_KEY, JSON.stringify(fsObj)); } catch (e) {}
      return fsObj;
    }
    try {
      var raw = localStorage.getItem(MM_OP_STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { contacts: [], messages: [], associations: [], appointments: [], queue: [] };
  }

  function saveLocalOpStore(store) {
    try { localStorage.setItem(MM_OP_STORE_KEY, JSON.stringify(store)); } catch (e) {}
    writeNodeJsonCandidates("dados/mm-sender-operacional.json", store);
  }

  var scheduled = false;
  function scheduleCheck() {
    if (scheduled) return;
    scheduled = true;
    setTimeout(function () {
      scheduled = false;
      syncAllScreenStates();
    }, 200);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scheduleCheck);
  } else {
    scheduleCheck();
  }
  refreshConnectionAndMetricsFromApis();
  setInterval(refreshConnectionAndMetricsFromApis, 6000);

  // MutationObserver enxuto: observa APENAS childList (sem attributes!) e ignora nós próprios -> ZERO FLICKER!
  var obs = new MutationObserver(function (mutations) {
    var relevant = false;
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.target && m.target.closest && m.target.closest("[data-serena-managed='1']")) continue;
      if (m.addedNodes && m.addedNodes.length > 0) {
        for (var a = 0; a < m.addedNodes.length; a++) {
          var an = m.addedNodes[a];
          if (an.nodeType === 1 && an.getAttribute && an.getAttribute("data-serena-managed") === "1") continue;
          relevant = true;
          break;
        }
      }
      if (relevant) break;
    }
    if (relevant) scheduleCheck();
  });
  if (document.documentElement) {
    obs.observe(document.documentElement, { childList: true, subtree: true });
  }

  document.addEventListener("click", function (ev) {
    var navHit = isNavOrTabElement(ev.target);
    if (navHit) {
      var mapped = mapLabelToCanonicalSection(navHit.label);
      if (mapped === "config_zelda") {
        activeSettingsScreen = "zelda";
      } else if (mapped === "config_geral") {
        activeSettingsScreen = "geral";
      }
      lastClickedSection = mapped;
      scheduleCheck();
    }
  }, true);
})();
</script>
